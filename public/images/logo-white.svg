<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="100%" height="100%">
  <defs>
    <linearGradient id="logoWhiteIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="logoWhiteGlyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="logoWhiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(6, 9)" filter="url(#logoWhiteGlow)">
    <rect width="72" height="72" rx="18" fill="url(#logoWhiteIconBg)"/>
    <rect x="2" y="2" width="68" height="68" rx="16" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.3"/>

    <!-- Left Pillar -->
    <rect x="17" y="19" width="8" height="34" rx="4" fill="url(#logoWhiteGlyphGrad)"/>
    <!-- Right Pillar -->
    <rect x="47" y="19" width="8" height="34" rx="4" fill="url(#logoWhiteGlyphGrad)"/>
    <!-- Chevron Crossbar -->
    <path d="M 21 36 L 36 29 L 51 36 L 51 42 L 36 35 L 21 42 Z" fill="url(#logoWhiteGlyphGrad)"/>
    <!-- Mortarboard Accent Peak -->
    <polygon points="36,15 43,20 36,25 29,20" fill="#38bdf8"/>
    <circle cx="36" cy="20" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Typography Right Side -->
  <g transform="translate(94, 2)">
    <!-- Wordmark -->
    <text x="0" y="46" font-family="'Plus Jakarta Sans', 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="1.5" fill="#ffffff">
      HIRELY
    </text>

    <!-- Subtitle / OS Classification -->
    <g transform="translate(2, 66)">
      <!-- Mini Pill Accent -->
      <rect x="0" y="-10" width="6" height="6" rx="3" fill="#10b981"/>
      <text x="12" y="-4" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#94a3b8" text-transform="uppercase">
        UNIVERSITY RECRUITMENT OS
      </text>
    </g>
  </g>
</svg>
