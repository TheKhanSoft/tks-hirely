<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="avatarPerson" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Circular Base -->
  <rect width="200" height="200" rx="100" fill="url(#avatarBg)"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#475569" stroke-width="2"/>

  <!-- Head Silhouette -->
  <circle cx="100" cy="74" r="36" fill="url(#avatarPerson)"/>

  <!-- Shoulders / Torso Silhouette with Circular Clipping -->
  <g clip-path="url(#circleClip)">
    <clipPath id="circleClip">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
    <path d="M 38 184 C 42 136, 70 124, 100 124 C 130 124, 158 136, 162 184 Z" fill="url(#avatarPerson)"/>
  </g>
</svg>
