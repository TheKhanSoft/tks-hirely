<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Emblem Inner Gradient -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>

    <!-- Accent Cyan Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>

    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle App Tile Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Subtle Inner Ring Highlight -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.2"/>

  <!-- Brand Glyph: Integrated "H" Monogram + Academic Cap / Upward Dossier Wings -->
  <g filter="url(#glyphShadow)" transform="translate(0, 4)">
    <!-- Left Pillar of H -->
    <rect x="120" y="132" width="56" height="248" rx="28" fill="url(#glyphGrad)"/>

    <!-- Right Pillar of H -->
    <rect x="336" y="132" width="56" height="248" rx="28" fill="url(#glyphGrad)"/>

    <!-- Dynamic Central Crossbar with Upward Chevron (Apex of Career Ascent) -->
    <path d="M 148 256 L 256 206 L 364 256 L 364 296 L 256 246 L 148 296 Z" fill="url(#glyphGrad)"/>

    <!-- Academic Cap Diamond / North Star at Zenith -->
    <polygon points="256,108 304,140 256,172 208,140" fill="url(#accentGrad)"/>
    
    <!-- Tassel / Honor Ribbon Accent -->
    <circle cx="256" cy="140" r="10" fill="#ffffff"/>
    <path d="M 304 140 C 316 150, 320 170, 318 190" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="318" cy="192" r="6" fill="#38bdf8"/>
  </g>
</svg>
